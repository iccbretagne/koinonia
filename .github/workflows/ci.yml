name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "mysql://dummy:dummy@localhost/dummy"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"
      # requis par src/modules/audio/worker/handlers/__tests__/render.test.ts (T043) — vrai
      # ffmpeg, pas de binaire mocké ; absent de l'image ubuntu-latest par défaut.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:boundaries
      - run: npm run test:coverage
      # Bloque l'ajout d'une dependance de PRODUCTION vulnerable (haute ou critique). Limite a
      # `--omit=dev` volontairement : une faille dans un outil de build ou de test n'est pas
      # exposee aux utilisateurs, et faire echouer la CI dessus pousserait a desactiver le
      # garde-fou. Le graphe de production est a zero vulnerabilite au moment de l'ajout de
      # cette etape — le seuil est donc tenable et non un voeu pieux.
      - run: npm audit --omit=dev --audit-level=high

  build:
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "mysql://dummy:dummy@localhost/dummy"
      AUTH_SECRET: "ci-placeholder-32-chars-minimum!!"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      # `npm run build` produit aussi dist/worker.mjs (esbuild) — le worker audio est bundlé,
      # il n'a donc besoin ni de src/ ni de tsx sur le serveur (ADR-0007).
      - run: npm run build

      # --- Empaquetage de l'artefact de release (tags uniquement) ---------------------
      # L'artefact deploye est construit ICI, dans le contexte non privilegie de la CI, et
      # promu tel quel par deploy.yml. Le workflow de deploiement ne recompile donc jamais
      # le code : c'est ce qui garantit que le binaire deploye est exactement celui qui a
      # ete teste, et ce qui evite de faire tourner un build en contexte privilegie
      # (CodeQL actions/cache-poisoning).
      - name: Determine version
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # Élague les devDependencies APRÈS le build : l'archive n'embarque plus typescript,
      # vitest, eslint, esbuild… La CLI `prisma` est en `dependencies` (requise sur le serveur
      # pour `migrate deploy`) et survit donc à l'élagage.
      - name: Prune dev dependencies
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm prune --omit=dev

      - name: Package artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar czf "koinonia-${VERSION}.tar.gz" \
            --exclude='prisma/scripts' \
            .next/standalone .next/static dist \
            prisma prisma.config.ts public package.json \
            node_modules
          echo "Built koinonia-${VERSION}.tar.gz"
          du -sh "koinonia-${VERSION}.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: koinonia-${{ steps.version.outputs.version }}
          path: koinonia-${{ steps.version.outputs.version }}.tar.gz
          retention-days: 14

  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Tag v$TAG matches package.json version $PKG"
