name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version a deployer (ex: 0.5.0)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    steps:
      - run: echo "CI passed, deploy allowed"

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "mysql://dummy:dummy@localhost/dummy"
    steps:
      # Sur workflow_run, sans `ref` explicite le checkout prend le HEAD de la branche
      # par defaut : on deploierait alors un commit different de celui valide par la CI.
      # On epingle le SHA exact du run declencheur (le tag pour un dispatch manuel).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || format('v{0}', inputs.version) }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "${{ steps.version.outputs.version }}" != "$PKG" ]; then
            echo "::error::Version mismatch: tag=${{ steps.version.outputs.version }} package.json=$PKG"
            exit 1
          fi

      - run: npm ci
      - run: npx prisma generate
      # `npm run build` produit aussi dist/worker.mjs (esbuild) — le worker audio est bundlé,
      # il n'a donc besoin ni de src/ ni de tsx sur le serveur (ADR-0007).
      - run: npm run build

      # Élague les devDependencies APRÈS le build : l'archive n'embarque plus typescript,
      # vitest, eslint, esbuild… La CLI `prisma` est en `dependencies` (requise sur le serveur
      # pour `migrate deploy`) et survit donc à l'élagage.
      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package artifact
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar czf "koinonia-${VERSION}.tar.gz" \
            --exclude='prisma/scripts' \
            .next/standalone .next/static dist \
            prisma prisma.config.ts public package.json \
            node_modules
          echo "Built koinonia-${VERSION}.tar.gz"
          du -sh "koinonia-${VERSION}.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: koinonia-${{ steps.version.outputs.version }}
          path: koinonia-${{ steps.version.outputs.version }}.tar.gz
          retention-days: 14

    outputs:
      version: ${{ steps.version.outputs.version }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: koinonia-${{ needs.build.outputs.version }}

      - name: Upload artifact to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: koinonia-${{ needs.build.outputs.version }}.tar.gz
          target: /tmp

      - name: Deploy artifact via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: VERSION,DEPLOY_PATH
          script: |
            set -e
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/koinonia}"

            echo "Deploying v${VERSION}..."

            # 1. Prepare release directory
            mkdir -p "$DEPLOY_PATH/releases/koinonia-${VERSION}"
            cd "$DEPLOY_PATH/releases/koinonia-${VERSION}"

            # 2. Extract pre-built artifact
            tar xzf "/tmp/koinonia-${VERSION}.tar.gz"
            rm "/tmp/koinonia-${VERSION}.tar.gz"

            # 3. Assemble standalone bundle (Next.js standalone output)
            cp -r .next/static .next/standalone/.next/static
            cp -r public .next/standalone/public
            ln -sf "$DEPLOY_PATH/shared/.env" .next/standalone/.env

            # 4. Run migrations
            set -a; source "$DEPLOY_PATH/shared/.env"; set +a
            ./node_modules/.bin/prisma migrate deploy --schema=prisma/schema.prisma

            # 5. Activate release
            ln -sfn "$DEPLOY_PATH/releases/koinonia-${VERSION}" "$DEPLOY_PATH/current"

            # 6. Restart
            sudo systemctl restart koinonia

            # 6b. Restart audio worker (separate unit, ADR-0007) if installed on this host —
            # sans cela il continuerait de tourner sur le bundle de la release precedente.
            if systemctl list-unit-files | grep -q '^koinonia-audio-worker\.service'; then
              sudo systemctl restart koinonia-audio-worker
            else
              echo "koinonia-audio-worker.service absent — worker audio non deploye sur cet hote"
            fi

            # 7. Cleanup: keep last 3 releases
            cd "$DEPLOY_PATH/releases"
            ls -1dt koinonia-*/ | tail -n +4 | xargs rm -rf || true

            echo "Deploy v${VERSION} OK"
