sonar.projectKey=iccbretagne_koinonia
sonar.organization=iccbretagne
sonar.projectName=Koinonia
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src,prisma
sonar.test.inclusions=**/*.test.ts,**/__tests__/**,**/__mocks__/**
sonar.exclusions=src/generated/**,**/*.d.ts,.next/**
# Couverture exigée sur le TypeScript hors React (même périmètre que vitest.config.ts) ;
# pages et composants .tsx n'ont pas de tests et restent contrôlés par les autres conditions.
sonar.coverage.exclusions=src/generated/**,**/*.d.ts,**/__tests__/**,**/__mocks__/**,src/components/**,src/app/**/*.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json
# Catalogue déclaratif du guide : 65 fiches de même forme (texte + accès des dix rôles), que la
# détection de duplication prend pour du copier-coller à chaque modification du guide.
sonar.cpd.exclusions=src/components/GuideContent.tsx
